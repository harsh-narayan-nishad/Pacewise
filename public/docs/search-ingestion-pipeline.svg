<text x="285.0" y="469.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2233">Pre-process</text>
<text x="285.0" y="485.0" text-anchor="middle" font-size="11.5" fill="#4b5468">deskew · denoise</text>
