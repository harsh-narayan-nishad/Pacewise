<text x="900.0" y="144.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2233">Normalise</text>
<text x="900.0" y="160.0" text-anchor="middle" font-size="11.5" fill="#4b5468">Unicode NFKC · language detect</text>
<rect x="790" y="200" width="220" height="54" rx="12" fill="#e7f7ee" stroke="#1f9d61" stroke-width="1.5"/>
