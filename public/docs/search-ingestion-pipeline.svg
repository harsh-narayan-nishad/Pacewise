<path d="M550 91 L590 91" fill="none" stroke="#4b5468" stroke-width="1.8"  marker-end="url(#a)"/>
<rect x="190" y="190" width="560" height="190" rx="18" fill="#e7f7ee" fill-opacity=".45" stroke="#1f9d61" stroke-opacity=".6" stroke-dasharray="6 5"/>
<text x="206" y="212" font-size="12" font-weight="700" letter-spacing=".08em" fill="#1f9d61">LANE B · PDFS</text>
<rect x="210" y="236" width="150" height="66" rx="12" fill="#e7f7ee" stroke="#1f9d61" stroke-width="1.5"/>
<text x="285.0" y="266.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2233">Text layer?</text>
<text x="285.0" y="282.0" text-anchor="middle" font-size="11.5" fill="#4b5468">chars per page</text>
<text x="285.0" y="296.0" text-anchor="middle" font-size="11.5" fill="#4b5468">above threshold</text>
