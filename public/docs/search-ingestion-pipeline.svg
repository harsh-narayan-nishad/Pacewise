<text x="475.0" y="469.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2233">OCR</text>
<text x="475.0" y="485.0" text-anchor="middle" font-size="11.5" fill="#4b5468">text + bbox</text>
<text x="475.0" y="499.0" text-anchor="middle" font-size="11.5" fill="#4b5468">confidence</text>
<rect x="590" y="440" width="140" height="64" rx="12" fill="#f1ebff" stroke="#7a4fd6" stroke-width="1.5"/>
<text x="660.0" y="469.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2233">Caption / embed</text>
<text x="660.0" y="485.0" text-anchor="middle" font-size="11.5" fill="#4b5468">optional · CLIP</text>
