<rect width="1040" height="560" rx="22" fill="#ffffff"/><rect x="0.5" y="0.5" width="1039" height="559" rx="22" fill="none" stroke="#dfe3ec"/>
<rect x="30" y="230" width="120" height="76" rx="12" fill="#f3f4f7" stroke="#6b7385" stroke-width="1.5"/>
<text x="90.0" y="265.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2233">File arrives</text>
<text x="90.0" y="281.0" text-anchor="middle" font-size="11.5" fill="#4b5468">type sniffed by</text>
<text x="90.0" y="295.0" text-anchor="middle" font-size="11.5" fill="#4b5468">MIME + magic bytes</text>
<rect x="190" y="20" width="560" height="150" rx="18" fill="#eaf1ff" fill-opacity=".45" stroke="#306fdb" stroke-opacity=".6" stroke-dasharray="6 5"/>
<text x="206" y="42" font-size="12" font-weight="700" letter-spacing=".08em" fill="#306fdb">LANE A · NOTES, DOCS, MARKDOWN</text>
<rect x="210" y="58" width="150" height="66" rx="12" fill="#eaf1ff" stroke="#306fdb" stroke-width="1.5"/>
<text x="285.0" y="88.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2233">Parse structure</text>
<text x="285.0" y="104.0" text-anchor="middle" font-size="11.5" fill="#4b5468">headings · links · code</text>
<rect x="400" y="58" width="150" height="66" rx="12" fill="#eaf1ff" stroke="#306fdb" stroke-width="1.5"/>
<text x="475.0" y="88.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2233">Strip markup</text>
<text x="475.0" y="104.0" text-anchor="middle" font-size="11.5" fill="#4b5468">keep heading level</text>
<text x="475.0" y="118.0" text-anchor="middle" font-size="11.5" fill="#4b5468">as a weight</text>
<rect x="590" y="58" width="140" height="66" rx="12" fill="#eaf1ff" stroke="#306fdb" stroke-width="1.5"/>
<text x="660.0" y="88.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2233">Plain text</text>
<text x="660.0" y="104.0" text-anchor="middle" font-size="11.5" fill="#4b5468">+ outline</text>
