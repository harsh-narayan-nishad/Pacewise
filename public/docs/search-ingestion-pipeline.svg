<rect x="190" y="400" width="560" height="140" rx="18" fill="#fff4e0" fill-opacity=".45" stroke="#d98a0b" stroke-opacity=".6" stroke-dasharray="6 5"/>
<text x="206" y="422" font-size="12" font-weight="700" letter-spacing=".08em" fill="#d98a0b">LANE C · IMAGES</text>
