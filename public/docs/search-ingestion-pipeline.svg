<text x="660.0" y="319.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2233">OCR page</text>
<text x="660.0" y="335.0" text-anchor="middle" font-size="11.5" fill="#4b5468">words + bbox</text>
