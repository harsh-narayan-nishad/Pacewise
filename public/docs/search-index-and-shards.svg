<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" width="1040" height="600" role="img" aria-labelledby="t d" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<title id="t">Index structure and tenant-routed shards</title><desc id="d">Inverted index intersection example and how a user&#x27;s id selects one shard.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4b5468"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#306fdb"/></marker></defs>
<rect width="1040" height="600" rx="22" fill="#ffffff"/><rect x="0.5" y="0.5" width="1039" height="599" rx="22" fill="none" stroke="#dfe3ec"/>
<rect x="20" y="20" width="1000" height="300" rx="18" fill="#eaf1ff" fill-opacity=".45" stroke="#306fdb" stroke-opacity=".6" stroke-dasharray="6 5"/>
<text x="36" y="42" font-size="12" font-weight="700" letter-spacing=".08em" fill="#306fdb">INVERTED INDEX · SAME IDEA AS THE GOOGLE PAPER</text>
<rect x="44" y="70" width="170" height="56" rx="12" fill="#f3f4f7" stroke="#6b7385" stroke-width="1.5"/>
<text x="129.0" y="95.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2233">Query</text>
<text x="129.0" y="111.0" text-anchor="middle" font-size="11.5" fill="#4b5468">“online shopping”</text>
<rect x="264" y="70" width="170" height="56" rx="12" fill="#fff4e0" stroke="#d98a0b" stroke-width="1.5"/>
<text x="349.0" y="95.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2233">Lexicon (in memory)</text>
<text x="349.0" y="111.0" text-anchor="middle" font-size="11.5" fill="#4b5468">term → termId · df · offset</text>
<path d="M214 98 L264 98" fill="none" stroke="#4b5468" stroke-width="1.8"  marker-end="url(#a)"/>
<rect x="484" y="56" width="320" height="52" rx="12" fill="#e7f7ee" stroke="#1f9d61" stroke-width="1.5"/>
<text x="644.0" y="79.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2233">online → 13  28  49  54  99</text>
<text x="644.0" y="95.0" text-anchor="middle" font-size="11.5" fill="#4b5468">postings: docId · tf · positions · field</text>
<rect x="484" y="128" width="320" height="52" rx="12" fill="#e7f7ee" stroke="#1f9d61" stroke-width="1.5"/>
<text x="644.0" y="151.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2233">shopping → 13  23  49  57</text>
<text x="644.0" y="167.0" text-anchor="middle" font-size="11.5" fill="#4b5468">postings: docId · tf · positions · field</text>
<path d="M434 90 L484 82" fill="none" stroke="#4b5468" stroke-width="1.8"  marker-end="url(#a)"/>
<path d="M434 106 L484 154" fill="none" stroke="#4b5468" stroke-width="1.8"  marker-end="url(#a)"/>
<rect x="850" y="86" width="150" height="66" rx="12" fill="#f1ebff" stroke="#7a4fd6" stroke-width="1.5"/>
<text x="925.0" y="116.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2233">Intersect</text>
<text x="925.0" y="132.0" text-anchor="middle" font-size="11.5" fill="#4b5468">13 and 49</text>
<path d="M804 82 L830 82 L830 106 L850 106" fill="none" stroke="#4b5468" stroke-width="1.8"  marker-end="url(#a)"/>
<path d="M804 154 L830 154 L830 132 L850 132" fill="none" stroke="#4b5468" stroke-width="1.8"  marker-end="url(#a)"/>
<rect x="44" y="214" width="250" height="82" rx="12" fill="#f3f4f7" stroke="#6b7385" stroke-width="1.5"/>
<text x="169.0" y="252.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2233">Forward index</text>
<text x="169.0" y="268.0" text-anchor="middle" font-size="11.5" fill="#4b5468">docId → words + positions</text>
<text x="169.0" y="282.0" text-anchor="middle" font-size="11.5" fill="#4b5468">built first, sorted by docId</text>
<rect x="334" y="214" width="250" height="82" rx="12" fill="#e7f7ee" stroke="#1f9d61" stroke-width="1.5"/>
<text x="459.0" y="252.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2233">Inverted index</text>
<text x="459.0" y="268.0" text-anchor="middle" font-size="11.5" fill="#4b5468">termId → postings</text>
<text x="459.0" y="282.0" text-anchor="middle" font-size="11.5" fill="#4b5468">re-sorted by term</text>
<rect x="624" y="214" width="376" height="82" rx="12" fill="#fff4e0" stroke="#d98a0b" stroke-width="1.5"/>
<text x="812.0" y="252.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2233">Hits record (per word occurrence)</text>
<text x="812.0" y="268.0" text-anchor="middle" font-size="11.5" fill="#4b5468">word · position · heading level (font-size analogue)</text>
<text x="812.0" y="282.0" text-anchor="middle" font-size="11.5" fill="#4b5468">capitalised · inside link text · field (title / body / OCR)</text>
<path d="M294 255 L334 255" fill="none" stroke="#4b5468" stroke-width="1.8"  marker-end="url(#a)"/>
<text x="314" y="246" text-anchor="middle" font-size="11" fill="#4b5468" paint-order="stroke" stroke="#fff" stroke-width="4">sort by term</text>
<path d="M584 255 L624 255" fill="none" stroke="#4b5468" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a)"/>
<rect x="20" y="350" width="1000" height="230" rx="18" fill="#e7f7ee" fill-opacity=".45" stroke="#1f9d61" stroke-opacity=".6" stroke-dasharray="6 5"/>
<text x="36" y="372" font-size="12" font-weight="700" letter-spacing=".08em" fill="#1f9d61">TENANT ROUTING · WHY ONE QUERY TOUCHES ONE SHARD</text>
<rect x="44" y="410" width="130" height="64" rx="12" fill="#f3f4f7" stroke="#6b7385" stroke-width="1.5"/>
<text x="109.0" y="439.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2233">userId</text>
<text x="109.0" y="455.0" text-anchor="middle" font-size="11.5" fill="#4b5468">u-48213</text>
<rect x="224" y="410" width="160" height="64" rx="12" fill="#eaf1ff" stroke="#306fdb" stroke-width="1.5"/>
<text x="304.0" y="439.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2233">hash(userId) % N</text>
<text x="304.0" y="455.0" text-anchor="middle" font-size="11.5" fill="#4b5468">stable · consistent hashing</text>
<path d="M174 442 L224 442" fill="none" stroke="#4b5468" stroke-width="1.8"  marker-end="url(#a)"/>
<path d="M384 442 L444 442" fill="none" stroke="#4b5468" stroke-width="1.8"  marker-end="url(#a)"/>
<rect x="444" y="384" width="190" height="44" rx="12" fill="#e7f7ee" stroke="#1f9d61" stroke-width="1.5"/>
<text x="539.0" y="411.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2233">Shard 7 · primary</text>
<rect x="444" y="442" width="190" height="44" rx="12" fill="#f3f4f7" stroke="#6b7385" stroke-width="1.5"/>
<text x="539.0" y="469.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2233">Replica A</text>
<rect x="444" y="500" width="190" height="44" rx="12" fill="#f3f4f7" stroke="#6b7385" stroke-width="1.5"/>
<text x="539.0" y="527.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2233">Replica B</text>
<path d="M634 406 L690 406 L690 442 L724 442" fill="none" stroke="#4b5468" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a)"/>
<rect x="724" y="392" width="250" height="100" rx="12" fill="#fff4e0" stroke="#d98a0b" stroke-width="1.5"/>
<text x="849.0" y="439.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2233">Why not docId partitioning?</text>
<text x="849.0" y="455.0" text-anchor="middle" font-size="11.5" fill="#4b5468">Google needs ~500 servers per query.</text>
<text x="849.0" y="469.0" text-anchor="middle" font-size="11.5" fill="#4b5468">Private search filters on userId first —</text>
<text x="849.0" y="483.0" text-anchor="middle" font-size="11.5" fill="#4b5468">so one shard answers, no scatter-gather.</text>
</svg>
